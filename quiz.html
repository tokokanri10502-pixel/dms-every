<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WEBメディア用語テスト 総集編 | DMS</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Cormorant+Garamond:wght@600&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy:  #0d2145;
      --gold:  #b8922a;
      --gold2: #d4aa50;
      --gold3: #f0d080;
      --bg:    #f8f7f4;
      --bg2:   #ffffff;
      --bg3:   #f0ede8;
      --line:  #ddd8ce;
      --text:  #1a1a2a;
      --text2: #4a4a5a;
      --green: #1a6b45;
      --red:   #9b2020;
      --pink:  #c0306a;
      --sky:   #2277cc;
      --plum:  #6a3080;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      font-weight: 400;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* ========== HEADER ========== */
    .header {
      background: var(--navy);
      padding: 48px 0 44px;
      position: relative;
      overflow: hidden;
    }

    .session-ghost {
      position: absolute;
      right: 32px;
      top: 10px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 160px;
      font-weight: 600;
      color: rgba(255,255,255,0.05);
      line-height: 1;
      pointer-events: none;
      user-select: none;
    }

    .header-inner {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 40px;
      position: relative;
      z-index: 2;
    }

    .eyebrow {
      display: inline-block;
      font-family: 'Cormorant Garamond', serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold2);
      padding-bottom: 10px;
      border-bottom: 1px solid var(--gold);
      margin-bottom: 18px;
    }

    .header-title {
      font-size: 30px;
      font-weight: 900;
      color: #fff;
      line-height: 1.2;
      margin-bottom: 10px;
    }

    .header-sub {
      font-size: 13px;
      color: rgba(255,255,255,0.6);
    }

    .back-link {
      display: inline-block;
      margin-top: 16px;
      font-size: 12px;
      font-weight: 700;
      color: var(--gold2);
      text-decoration: none;
      letter-spacing: 0.05em;
    }
    .back-link:hover { text-decoration: underline; }

    /* ========== TAB BAR ========== */
    .tab-bar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--bg2);
      border-bottom: 1px solid var(--line);
      box-shadow: 0 2px 8px rgba(13,33,69,.06);
    }

    .tab-inner {
      max-width: 900px;
      margin: 0 auto;
      padding: 10px 24px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .tab-btn {
      flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      padding: 7px 16px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--bg);
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: var(--text2);
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .tab-btn:hover { border-color: var(--gold); color: var(--navy); }

    .tab-btn.active {
      background: var(--navy);
      border-color: var(--navy);
      color: #fff;
    }

    .tab-btn .tab-count {
      font-size: 11px;
      font-weight: 400;
      opacity: 0.75;
      margin-left: 3px;
    }

    /* ========== SCORE BAR ========== */
    .score-bar {
      background: var(--bg3);
      border-bottom: 1px solid var(--line);
    }

    .score-inner {
      max-width: 900px;
      margin: 0 auto;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
    }

    .score-item {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .score-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--gold);
    }

    .score-value {
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px;
      font-weight: 600;
      color: var(--navy);
      line-height: 1;
    }

    .score-actions { margin-left: auto; display: flex; gap: 8px; }

    .action-btn {
      padding: 6px 14px;
      border: 1px solid var(--line);
      border-radius: 3px;
      background: var(--bg2);
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 11px;
      font-weight: 700;
      color: var(--text2);
      cursor: pointer;
      transition: all 0.15s;
    }
    .action-btn:hover { border-color: var(--gold); color: var(--navy); }

    /* ========== QUIZ ========== */
    .section { padding: 40px 0 56px; }

    .quiz-container { display: flex; flex-direction: column; gap: 24px; }

    .quiz-item {
      background: var(--bg2);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 24px;
    }

    .quiz-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .quiz-num {
      font-family: 'Cormorant Garamond', serif;
      font-size: 26px;
      font-weight: 600;
      color: var(--gold);
      line-height: 1;
    }

    .quiz-cat-tag {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #fff;
      padding: 3px 10px;
      border-radius: 2px;
    }

    .quiz-src-tag {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--text2);
      background: rgba(13,33,69,0.06);
      padding: 3px 9px;
      border-radius: 2px;
    }

    .quiz-question {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.65;
      margin-bottom: 14px;
    }

    .quiz-choices {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    @media (max-width: 580px) {
      .quiz-choices { grid-template-columns: 1fr; }
    }

    .quiz-choice {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 4px;
      font-size: 13px;
      font-family: 'Noto Sans JP', sans-serif;
      font-weight: 400;
      cursor: pointer;
      background: var(--bg);
      color: var(--text);
      text-align: left;
      line-height: 1.55;
      position: relative;
      transition: border-color 0.15s, background 0.15s;
    }

    .quiz-choice:hover {
      border-color: var(--gold);
      background: rgba(184,146,42,0.05);
    }

    .quiz-choice.correct {
      background: linear-gradient(135deg, #e6f9ee 0%, #b8f0d0 100%) !important;
      border: 3px solid var(--green) !important;
      color: var(--green) !important;
      font-weight: 900;
      font-size: 14px;
      padding-left: 48px;
      animation: correctPop .4s ease;
    }

    .quiz-choice.correct::before {
      content: '⭕';
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 22px;
      animation: circleIn .5s ease;
    }

    @keyframes correctPop {
      0%   { transform: scale(1); }
      30%  { transform: scale(1.04); box-shadow: 0 0 18px rgba(26,107,69,.3); }
      100% { transform: scale(1); box-shadow: none; }
    }

    @keyframes circleIn {
      0%   { transform: translateY(-50%) scale(0) rotate(-90deg); opacity: 0; }
      50%  { transform: translateY(-50%) scale(1.4) rotate(0deg); opacity: 1; }
      100% { transform: translateY(-50%) scale(1) rotate(0deg); opacity: 1; }
    }

    .quiz-choice.incorrect {
      background: rgba(155,32,32,0.06) !important;
      border-color: var(--red) !important;
      color: var(--red) !important;
      padding-left: 48px;
    }

    .quiz-choice.incorrect::before {
      content: '✕';
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 20px;
      font-weight: 900;
      color: var(--red);
    }

    .answer-badge {
      display: inline-block;
      margin-left: 10px;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 2px;
      vertical-align: middle;
      letter-spacing: 0.05em;
    }
    .badge-correct   { background: var(--green); color: #fff; }
    .badge-incorrect { background: var(--red);   color: #fff; }

    .quiz-explanation {
      display: none;
      margin-top: 14px;
      padding: 10px 14px;
      background: rgba(13,33,69,0.05);
      border-left: 3px solid var(--navy);
      border-radius: 0 4px 4px 0;
      font-size: 12px;
      color: var(--text2);
      line-height: 1.75;
    }

    /* ========== MOBILE ========== */
    @media (max-width: 680px) {
      .header { padding: 32px 0 28px; }
      .header-inner { padding: 0 20px; }
      .header-title { font-size: 21px; }
      .header-sub { font-size: 12px; }
      .session-ghost { font-size: 96px; right: 14px; top: 6px; }
      .container { padding: 0 14px; }
      .section { padding: 24px 0 40px; }
      .tab-inner { padding: 8px 14px; gap: 6px; }
      .tab-btn { padding: 8px 14px; font-size: 12px; }
      .score-inner { padding: 10px 14px; gap: 12px; }
      .score-value { font-size: 18px; }
      .action-btn { padding: 8px 12px; }
      .quiz-container { gap: 14px; }
      .quiz-item { padding: 16px 14px; }
      .quiz-num { font-size: 22px; }
      .quiz-question { font-size: 13.5px; }
      .quiz-choice { padding: 12px 14px; }
      .quiz-choice.correct { padding-left: 44px; }
      .quiz-choice.incorrect { padding-left: 44px; }
      .quiz-explanation { font-size: 11.5px; padding: 10px 12px; }
    }

    /* ========== QR CODE ========== */
    .qr-section { text-align: center; padding: 44px 0; background: var(--bg2); }
    .qr-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text2);
      margin-bottom: 18px;
    }
    #qrcode { display: inline-block; }

    /* ========== FOOTER ========== */
    .footer {
      background: var(--navy);
      color: rgba(255,255,255,0.45);
      text-align: center;
      padding: 20px;
      font-size: 11px;
      letter-spacing: 0.1em;
    }
  </style>
</head>
<body>

<!-- ===== HEADER ===== -->
<header class="header">
  <div class="session-ghost">68</div>
  <div class="header-inner">
    <div class="eyebrow">Digital Media Strategy Meeting</div>

<!-- ===== TAB BAR ===== -->
<nav class="tab-bar">

<div class="score-bar">

</div>

<!-- ===== QUIZ ===== -->
<section class="section">
  <div class="container">
    <div class="quiz-container" id="quizContainer"></div>

</section>

<section class="qr-section">

</section>

<!-- ===== FOOTER ===== -->
<footer class="footer">

</footer>

  {

    "explanation": "KGI（Key Goal Indicator）は、事業や施策の「最終ゴール」を数値で定義した指標です。例えば「年間売上10億円」「新規取引社数20社」がKGI、その達成に向けた「月間問い合わせ数」「提案件数」などの中間指標がKPI（Key Performance Indicator）です。KGIなきKPIは\"手段の目的化\"を招き、逆にKGIだけでは日々の行動につながりません。以前学んだOKRも同じ発想の目標管理手法です。社内のSNS運用やAI導入も、まず「何をKGIに置くか」から議論すると施策の優先順位が明確になります。",
    "category": "経営"
  },
  {
    "session": 15,
    "date": "2026-07-07",
    "question": "SNSやECサイトでリアルタイムのライブ配信を見ながら、視聴者がコメントで質問し、気に入った商品をその場で購入できる販売手法を何と呼ぶか？TikTok Shopの日本展開で再注目されている。",
    "choices": [
      "ライブコマース",
      "ショールーミング",
      "ドロップシッピング",
      "ダイナミックプライシング"
    ],
    "correctIndex": 0,
    "explanation": "ライブコマースは、ライブ配信で商品を紹介しながら、視聴者がコメントで質問し、その場で購入まで完結できる販売手法です。中国では小売の主要チャネルに成長し、日本でもTikTok Shopの上陸で一般化が現実味を帯びてきました。テレビ通販との違いは「双方向性」で、視聴者の質問に配信者が即答することで疑問がその場で解消され、購入率が高まります。印刷会社にとっては、配信を告知するチラシやQR付きPOP、配信で映える商品パッケージなど、周辺の販促物需要をセットで提案できる商機になります。",
    "category": "SNS"
  },
  {
    "session": 15,
    "date": "2026-07-07",
    "question": "売上総利益（粗利）から、人件費や広告費などの販売費・一般管理費を差し引いた利益が、売上高に占める割合を示す指標は？「本業でどれだけ効率よく稼げているか」を表す。",
    "choices": [
      "経常利益率",
      "売上高営業利益率",
      "ROA（総資産利益率）",
      "当座比率"
    ],
    "correctIndex": 1,
    "explanation": "売上高営業利益率は、「営業利益（売上総利益−販売費・一般管理費）÷ 売上高」で求める、本業の稼ぐ力を示す指標です。前回学んだ売上総利益率（粗利率）が「商品・サービスそのものの収益力」を表すのに対し、営業利益率はそこから間接部門のコストまで含めた\"経営全体の効率\"を映します。粗利率が高くても販管費が重ければ営業利益率は低くなります。AIによる事務・制作支援業務の効率化は販管費の圧縮に直結するため、営業利益率を直接押し上げる打ち手として投資対効果を説明しやすい領域です。",
    "category": "経営"
  }
];

  var CAT_COLORS = {
    'AI':    'var(--navy)',
    'SNS':   'var(--pink)',
    'WEB':   'var(--sky)',
    'マーケ': 'var(--gold)',
    '経営':  'var(--green)'
  };
  var CATEGORIES = ['すべて', 'AI', 'SNS', 'WEB', 'マーケ', '経営'];

  var currentCat = 'すべて';
  var order = QUIZ_DATA.map(function(_, i) { return i; });  // 表示順(シャッフル対象)
  var answers = {};  // dataIndex -> { selected: n, correct: bool }

  function sessionKai(q) { return q.session + 8; }

  function dateLabel(q) {
    var p = q.date.split('-');
    return parseInt(p[1], 10) + '/' + parseInt(p[2], 10);
  }

  // ===== TAB BAR =====
  function buildTabs() {
    var bar = document.getElementById('tabBar');
    bar.innerHTML = '';
    CATEGORIES.forEach(function(cat) {
      var count = cat === 'すべて' ? QUIZ_DATA.length : QUIZ_DATA.filter(function(q) { return q.category === cat; }).length;
      var btn = document.createElement('button');
      btn.className = 'tab-btn' + (cat === currentCat ? ' active' : '');
      btn.innerHTML = cat + '<span class="tab-count">' + count + '</span>';
      btn.onclick = function() {
        currentCat = cat;
        buildTabs();
        render();
      };
      bar.appendChild(btn);
    });
  }

  // ===== RENDER =====
  function render() {
    var container = document.getElementById('quizContainer');
    container.innerHTML = '';
    var num = 0;

    order.forEach(function(dataIdx) {
      var q = QUIZ_DATA[dataIdx];
      if (currentCat !== 'すべて' && q.category !== currentCat) return;
      num++;

      var item = document.createElement('div');
      item.className = 'quiz-item';

      var meta = document.createElement('div');
      meta.className = 'quiz-meta';
      meta.innerHTML =
        '<span class="quiz-num">Q' + num + '</span>' +
        '<span class="quiz-cat-tag" style="background:' + CAT_COLORS[q.category] + '">' + q.category + '</span>' +
        '<span class="quiz-src-tag">第' + sessionKai(q) + '回 ' + dateLabel(q) + ' 出題</span>';
      item.appendChild(meta);

      var question = document.createElement('div');
      question.className = 'quiz-question';
      question.textContent = q.question;
      item.appendChild(question);

      var choices = document.createElement('div');
      choices.className = 'quiz-choices';
      q.choices.forEach(function(choiceText, ci) {
        var btn = document.createElement('button');
        btn.className = 'quiz-choice';
        btn.textContent = choiceText;
        btn.onclick = function() { answerQuiz(dataIdx, ci, item, choices); };
        choices.appendChild(btn);
      });
      item.appendChild(choices);

      var exp = document.createElement('div');
      exp.className = 'quiz-explanation';
      exp.textContent = q.explanation;
      item.appendChild(exp);

      // 回答済みなら状態を復元
      if (answers[dataIdx]) {
        applyAnswered(dataIdx, item, choices, false);
      }

      container.appendChild(item);
    });

    updateScore();
  }

  // ===== ANSWER =====
  function answerQuiz(dataIdx, selectedIdx, item, choices) {
    if (answers[dataIdx]) return;
    var q = QUIZ_DATA[dataIdx];
    answers[dataIdx] = { selected: selectedIdx, correct: selectedIdx === q.correctIndex };
    applyAnswered(dataIdx, item, choices, true);
    updateScore();
  }

  function applyAnswered(dataIdx, item, choices, animate) {
    var q = QUIZ_DATA[dataIdx];
    var state = answers[dataIdx];
    var btns = choices.querySelectorAll('.quiz-choice');

    btns.forEach(function(b, i) {
      b.style.cursor = 'default';
      if (!animate) b.style.animation = 'none';
      if (i === q.correctIndex) {
        b.classList.add('correct');
        var badge = document.createElement('span');
        badge.className = 'answer-badge badge-correct';
        badge.textContent = '正解！';
        b.appendChild(badge);
      }
    });

    if (!state.correct) {
      var wrongBtn = btns[state.selected];
      wrongBtn.classList.add('incorrect');
      var badge = document.createElement('span');
      badge.className = 'answer-badge badge-incorrect';
      badge.textContent = '不正解';
      wrongBtn.appendChild(badge);
    }

    choices.style.pointerEvents = 'none';
    item.querySelector('.quiz-explanation').style.display = 'block';
  }

  // ===== SCORE =====
  function updateScore() {
    var inView = currentCat === 'すべて'
      ? QUIZ_DATA.map(function(_, i) { return i; })
      : QUIZ_DATA.map(function(q, i) { return q.category === currentCat ? i : -1; }).filter(function(i) { return i >= 0; });

    var answered = 0, correct = 0;
    inView.forEach(function(i) {
      if (answers[i]) {
        answered++;
        if (answers[i].correct) correct++;
      }
    });

    document.getElementById('scoreAnswered').textContent = answered;
    document.getElementById('scoreTotal').textContent = '/ ' + inView.length;
    document.getElementById('scoreCorrect').textContent = correct;
    document.getElementById('scoreRate').textContent = answered > 0 ? Math.round(correct / answered * 100) + '%' : '－';
  }

  // ===== ACTIONS =====
  function shuffleQuestions() {
    for (var i = order.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = order[i]; order[i] = order[j]; order[j] = tmp;
    }
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function resetQuiz() {
    answers = {};
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // ===== QR CODE =====
  new QRCode(document.getElementById('qrcode'), {
    text: 'https://tokokanri10502-pixel.github.io/dms-every/quiz.html',
    width: 200,
    height: 200,
    colorDark: '#000000',
    colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.H
  });

  // ===== INIT =====
  buildTabs();
  render();
</script>
</body>
